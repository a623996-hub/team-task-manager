<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background: linear-gradient(135deg,#667eea,#764ba2);
    min-height:100vh;
    padding-bottom:40px;
}

/* ================= NAVBAR ================= */

.navbar{
    width:100%;
    padding:30px 20px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(12px);
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
    text-align:center;
    color:white;
}

.navbar h1{
    font-size:40px;
    font-weight:700;
    letter-spacing:1px;
}

.navbar p{
    margin-top:8px;
    font-size:16px;
    opacity:0.9;
}

/* ================= CONTAINER ================= */

.container{
    max-width:1200px;
    margin:auto;
    padding:30px 20px;
}

/* ================= CARD ================= */

.card{
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(12px);
    border-radius:20px;
    padding:25px;
    margin-bottom:30px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    border:1px solid rgba(255,255,255,0.2);
}

/* ================= TITLES ================= */

.section-title{
    display:flex;
    align-items:center;
    gap:15px;
    font-size:24px;
    font-weight:700;
    color:white;
    margin-bottom:20px;
}

.icon-circle{
    width:55px;
    height:55px;
    border-radius:50%;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#6d28d9;
    font-size:22px;
}

/* ================= INPUTS ================= */

.form-group{
    margin-bottom:18px;
}

input{
    width:100%;
    padding:14px 16px;
    border:none;
    border-radius:12px;
    font-size:15px;
    outline:none;
    background:white;
}

/* ================= BUTTON ================= */

button{
    border:none;
    padding:14px 20px;
    border-radius:12px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.primary-btn{
    background: linear-gradient(135deg,#7c3aed,#4f46e5);
    color:white;
    width:100%;
}

.primary-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 18px rgba(0,0,0,0.2);
}

/* ================= GRID ================= */

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}

/* ================= PROJECT CARD ================= */

.project-box{
    background: linear-gradient(135deg,#ffffff,#f3f4ff);
    padding:20px;
    border-radius:18px;
    box-shadow:0 8px 18px rgba(0,0,0,0.12);
}

.project-box h3{
    color:#4f46e5;
    margin-bottom:10px;
    font-size:22px;
}

.project-box p{
    margin-bottom:10px;
    color:#444;
    font-size:14px;
}

/* ================= TASK CARD ================= */

.task-box{
    background: linear-gradient(135deg,#ffffff,#f9f5ff);
    padding:20px;
    border-radius:18px;
    box-shadow:0 8px 18px rgba(0,0,0,0.12);
    transition:0.3s;
}

.task-box:hover{
    transform:translateY(-5px);
}

.task-box h3{
    color:#6d28d9;
    margin-bottom:10px;
    font-size:22px;
}

.task-box p{
    margin-bottom:8px;
    color:#444;
    font-size:14px;
}

/* ================= STATUS ================= */

.status{
    display:inline-block;
    padding:6px 12px;
    border-radius:30px;
    font-size:12px;
    font-weight:600;
    margin-top:5px;
    background:#ede9fe;
    color:#6d28d9;
}

/* ================= DELETE BUTTON ================= */

.delete-btn{
    margin-top:15px;
    width:100%;
    background:#ef4444;
    color:white;
}

.delete-btn:hover{
    background:#dc2626;
}

/* ================= RESPONSIVE ================= */

@media(max-width:768px){

    .navbar h1{
        font-size:30px;
    }

    .section-title{
        font-size:20px;
    }
}

</style>
</head>

<body>

<!-- ================= NAVBAR ================= -->

<div class="navbar">

    <h1><i class="fa-solid fa-user-shield"></i> ADMIN DASHBOARD</h1>

</div>

<div class="container">

    <!-- ================= CREATE PROJECT ================= -->

    <div class="card">

        <div class="section-title">
            <div class="icon-circle">
                <i class="fa-solid fa-folder-plus"></i>
            </div>

            Create Project
        </div>

        <div class="form-group">
            <input id="projectName" placeholder="Enter Project Name">
        </div>

        <div class="form-group">
            <input id="projectDesc" placeholder="Enter Project Description">
        </div>

        <div class="form-group">
            <input id="createdBy" placeholder="Created By (Admin ID)">
        </div>

        <button class="primary-btn" onclick="createProject()">
            Create Project
        </button>

    </div>

    <!-- ================= CREATE TASK ================= -->

    <div class="card">

        <div class="section-title">

            <div class="icon-circle">
                <i class="fa-solid fa-list-check"></i>
            </div>

            Create Task

        </div>

        <div class="form-group">
            <input id="taskTitle" placeholder="Task Title">
        </div>

        <div class="form-group">
            <input id="taskDesc" placeholder="Task Description">
        </div>

        <div class="form-group">
            <input type="date" id="due_date">
        </div>

        <div class="form-group">
            <input id="projectId" placeholder="Project ID">
        </div>

        <div class="form-group">
            <input id="assignedTo" placeholder="Assign User ID">
        </div>

        <button class="primary-btn" onclick="createTask()">
            Create Task
        </button>

    </div>

    <!-- ================= ALL PROJECTS ================= -->

    <div class="card">

        <div class="section-title">

            <div class="icon-circle">
                <i class="fa-solid fa-diagram-project"></i>
            </div>

            All Projects

        </div>

        <button class="primary-btn" onclick="loadProjects()">
            Load Projects
        </button>

        <br><br>

        <div id="projectList" class="grid"></div>

    </div>

    <!-- ================= ALL TASKS ================= -->

    <div class="card">

        <div class="section-title">

            <div class="icon-circle">
                <i class="fa-solid fa-tasks"></i>
            </div>

            All Tasks

        </div>

        <button class="primary-btn" onclick="loadTasks()">
            Load Tasks
        </button>

        <br><br>

        <div id="taskList" class="grid"></div>

    </div>

</div>

<script>

const BASE_URL = "http://127.0.0.1:8000";

/* ================= CREATE PROJECT ================= */

async function createProject(){

    const data = {

        name: document.getElementById("projectName").value,

        description: document.getElementById("projectDesc").value,

        created_by: Number(document.getElementById("createdBy").value)
    };

    const res = await fetch(`${BASE_URL}/projects`, {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify(data)
    });

    const result = await res.json();

    alert(result.message || "Project Created Successfully");
}

/* ================= CREATE TASK ================= */

async function createTask(){

    const data = {

        title: document.getElementById("taskTitle").value,

        description: document.getElementById("taskDesc").value,

        due_date: document.getElementById("due_date").value,

        project_id: Number(document.getElementById("projectId").value),

        assigned_to: Number(document.getElementById("assignedTo").value)
    };

    const res = await fetch(`${BASE_URL}/tasks`, {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify(data)
    });

    const result = await res.json();

    alert(result.message || "Task Created Successfully");
}

/* ================= LOAD PROJECTS ================= */

async function loadProjects(){

    const res = await fetch(`${BASE_URL}/projects`);

    const projects = await res.json();

    const container = document.getElementById("projectList");

    container.innerHTML = "";

    projects.forEach(project => {

        container.innerHTML += `

            <div class="project-box">

                <h3>${project.name}</h3>

                <p><b>Description:</b> ${project.description}</p>

                <p><b>Created By:</b> ${project.created_by}</p>

            </div>

        `;
    });
}

/* ================= LOAD TASKS ================= */

async function loadTasks(){

    const user = JSON.parse(localStorage.getItem("user"));

    const res = await fetch(
        `${BASE_URL}/tasks?role=${user.role}&user_id=${user.id}`
    );

    const tasks = await res.json();

    const container = document.getElementById("taskList");

    container.innerHTML = "";

    tasks.forEach(task => {

        container.innerHTML += `

            <div class="task-box">

                <h3>${task.title}</h3>

                <p><b>Description:</b> ${task.description}</p>

                <p><b>Due Date:</b> ${task.due_date}</p>

                <span class="status">${task.status}</span>

                <button class="delete-btn"
                onclick="deleteTask(${task.id})">

                    Delete Task

                </button>

            </div>
        `;
    });
}

/* ================= DELETE TASK ================= */

async function deleteTask(id){

    await fetch(`${BASE_URL}/tasks/${id}`, {

        method:"DELETE"
    });

    loadTasks();
}

</script>

</body>
</html>
