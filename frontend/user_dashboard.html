<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
}

/* NAVBAR */
.navbar{
    background: rgba(0,0,0,0.2);
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 20px;
    font-weight: 500;
    backdrop-filter: blur(10px);
}

/* CONTAINER */
.container{
    padding: 25px;
    max-width: 900px;
    margin: auto;
}

/* TITLE AREA */
.title-box{
    text-align: center;
    color: white;
    margin-bottom: 25px;
}

/* TASK ICON CIRCLE */
.icon-circle{
    width: 80px;
    height: 80px;
    background: white;
    border-radius: 50%;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

.icon-circle i{
    font-size: 35px;
    color: #4f46e5;
}

/* MY TASK TITLE */
.title-box h2{
    margin-top: 10px;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 1px;
}

/* CARD */
.card{
    background: white;
    padding: 18px;
    margin-bottom: 15px;
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    transition: 0.3s;
}

.card:hover{
    transform: translateY(-3px);
}

/* TASK TITLE */
.card h3{
    margin: 0;
    font-weight: 700;
    color: #333;
}

/* DESCRIPTION */
.card p{
    color: #666;
}

/* STATUS */
.status{
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    color: white;
    display: inline-block;
    margin-top: 8px;
}

.pending{ background: orange; }
.completed{ background: green; }
.inprogress{ background: #2563eb; }

/* BUTTON */
.btn{
    background: #4f46e5;
    color: white;
    padding: 8px 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 10px;
    margin-right: 5px;
    transition: 0.2s;
}

.btn:hover{
    background: #4338ca;
}

</style>
</head>

<body>

<div class="navbar">
    User Dashboard - Task Manager
</div>

<div class="container">

    <!-- ICON + TITLE -->
    <div class="title-box">
        <div class="icon-circle">
            <i class="fa-solid fa-list-check"></i>
        </div>
        <h2>MY TASKS</h2>
    </div>

    <div id="taskContainer"></div>

</div>

<script>

const BASE_URL = "http://127.0.0.1:8000";

const user = JSON.parse(localStorage.getItem("user"));

if (!user) {
    alert("Please login first");
    window.location.href = "login.html";
}

// LOAD TASKS
async function loadTasks() {

    const response = await fetch(`${BASE_URL}/tasks?role=${user.role}&user_id=${user.id}`);
    const tasks = await response.json();

    const container = document.getElementById("taskContainer");
    container.innerHTML = "";

    tasks.forEach(task => {

        let statusClass = task.status.toLowerCase().replace(" ", "");

        container.innerHTML += `
            <div class="card">

                <h3>${task.title}</h3>
                <p>${task.description || ""}</p>

                <span class="status ${statusClass}">
                    ${task.status}
                </span>

                <br>

                <button class="btn" onclick="updateStatus(${task.id}, 'completed')">
                    Mark Completed
                </button>

                <button class="btn" onclick="updateStatus(${task.id}, 'in progress')">
                    In Progress
                </button>

            </div>
        `;
    });
}

// UPDATE STATUS
async function updateStatus(id, status) {

    const response = await fetch(`${BASE_URL}/tasks/${id}`, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ status: status })
    });

    const data = await response.json();

    alert(data.message);

    loadTasks();
}

loadTasks();

</script>

</body>
</html>
